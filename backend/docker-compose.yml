services:
  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis  
    volumes:
      - ./data:/app/data
    profiles:
      - dev-ha
      - dev-mock
      - full

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    profiles:
      - dev-ha
      - dev-mock
      - full
